name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Smoke tests (tests/smoke/*.mjs) need a live Path of Building install
      # and are not runnable on CI runners — this runs build + jest + the
      # coverage thresholds (jest.config.cjs coverageThreshold).
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
